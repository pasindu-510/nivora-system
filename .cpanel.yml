# cPanel Git Version Control deployment tasks (used by "Deploy HEAD Commit").
#
# Matches the live layout on nivora.lk:
#   repo clone        ~/repositories/nivora-system
#   Application root  repositories/nivora-system/backend   (Setup Python App)
#   virtualenv        ~/virtualenv/repositories/nivora-system/backend/3.12
# The SPA (frontend/dist) is NOT deployed by this file — upload it to
# public_html/system.nivora.lk separately (see docs/deploy-cpanel.md).
# Plain `git pull && touch backend/tmp/restart.txt` in the Terminal also works.
---
deployment:
  tasks:
    - export DEPLOYDIR=$HOME/repositories/nivora-system/backend
    - export VENV_PY=$HOME/virtualenv/repositories/nivora-system/backend/3.12/bin/python
    - $VENV_PY -m pip install -r $DEPLOYDIR/requirements-pymysql.txt   # server uses PyMySQL (mysqlclient cannot compile here)
    - cd $DEPLOYDIR && $VENV_PY manage.py migrate --noinput
    - cd $DEPLOYDIR && $VENV_PY manage.py collectstatic --noinput
    - mkdir -p $DEPLOYDIR/tmp && touch $DEPLOYDIR/tmp/restart.txt
